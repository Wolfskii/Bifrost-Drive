  <text x="475" y="372" fill="#71888c" font-family="Arial, sans-serif" font-size="15">Google Drive · Mounted as B:</text>
  <rect x="1217" y="329" width="116" height="44" rx="8" fill="#e8f2f1"/>
  <text x="1246" y="357" fill="#17191c" font-family="Arial, sans-serif" font-size="14" font-weight="700">Open drive</text>
  <rect x="360" y="438" width="1010" height="130" rx="12" fill="#fff" stroke="#d6e1e2"/>
  <circle cx="420" cy="503" r="30" fill="#edf1fb"/>
  <text x="407" y="512" fill="#285da8" font-family="Arial, sans-serif" font-size="26" font-weight="700">S3</text>
  <text x="475" y="493" fill="#14383f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Archive</text>
  <text x="475" y="524" fill="#71888c" font-family="Arial, sans-serif" font-size="15">S3 · Mounted as S:</text>
  <rect x="1217" y="481" width="116" height="44" rx="8" fill="#e8f2f1"/>
  <text x="1246" y="509" fill="#17191c" font-family="Arial, sans-serif" font-size="14" font-weight="700">Open drive</text>
  <rect x="360" y="625" width="470" height="190" rx="12" fill="#14383f"/>
  <text x="396" y="675" fill="#8eb9b4" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">ACTIVITY</text>
  <text x="396" y="719" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Files stay in motion.</text>
  <rect x="396" y="756" width="290" height="12" rx="6" fill="#31565c"/>
  <rect x="396" y="756" width="218" height="12" rx="6" fill="#f2c879"/>
