<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Bifrost Drive desktop application preview</title>
  <desc id="description">A replaceable placeholder showing the Bifrost Drive connections interface.</desc>
  <rect width="1440" height="900" rx="24" fill="#f4f8f8"/>
  <rect width="280" height="900" fill="#eaf1f1"/>
  <rect x="34" y="42" width="56" height="56" rx="13" fill="#17191c"/>
  <path d="M46 76c9-18 20-27 30-27s21 9 30 27M49 76h54" fill="none" stroke="#e9f4f0" stroke-width="6" stroke-linecap="round"/>
  <text x="108" y="68" fill="#14383f" font-family="Arial, sans-serif" font-size="24" font-weight="700">Bifrost Drive</text>
  <text x="108" y="89" fill="#6d8589" font-family="Arial, sans-serif" font-size="12">One gateway. Every storage.</text>
  <rect x="20" y="160" width="240" height="58" rx="10" fill="#d5e5e3"/>
  <circle cx="48" cy="189" r="9" fill="#247cff"/>
