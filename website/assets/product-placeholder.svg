  <rect x="856" y="625" width="514" height="190" rx="12" fill="#e4eeee"/>
  <text x="892" y="675" fill="#247cff" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">LOCAL-FIRST</text>
  <text x="892" y="719" fill="#14383f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Credentials stay in your OS vault.</text>
  <text x="892" y="758" fill="#637d81" font-family="Arial, sans-serif" font-size="15">No plaintext passwords in the app database.</text>
  <text x="1240" y="868" fill="#82979a" font-family="Arial, sans-serif" font-size="12">REPLACEABLE PLACEHOLDER</text>
