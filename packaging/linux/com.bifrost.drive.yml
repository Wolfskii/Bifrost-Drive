app-id: com.bifrost.drive
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: bifrost-drive
default-branch: stable
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  - name: bifrost-drive
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bifrost
      - cp -a appdir/. /app/bifrost/
      - install -Dm755 bifrost-drive-flatpak.sh /app/bin/bifrost-drive
      - install -Dm644 com.bifrost.drive.desktop /app/share/applications/com.bifrost.drive.desktop
      - install -Dm644 com.bifrost.drive.metainfo.xml /app/share/metainfo/com.bifrost.drive.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.bifrost.drive.png
    sources:
      - type: dir
        path: ../../.cache/flatpak-appdir
        dest: appdir
      - type: file
        path: bifrost-drive-flatpak.sh
      - type: file
        path: com.bifrost.drive.desktop
      - type: file
        path: com.bifrost.drive.metainfo.xml
      - type: file
        path: ../../apps/desktop/src-tauri/icons/icon.png
        dest-filename: icon.png
