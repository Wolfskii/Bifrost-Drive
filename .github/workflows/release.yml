name: Stable Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Build frontend
        run: npm --prefix apps/desktop run build
      - name: Lint frontend
        run: npm --prefix apps/desktop run lint
      - name: Test frontend
        run: npm --prefix apps/desktop run test
      - name: Validate release metadata
        run: cargo run -p xtask -- release-check
      - name: Require release signing secrets
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Stable releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD repository secrets"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Stable releases require TAURI_SIGNING_PRIVATE_KEY repository secret"
          }
          try {
            $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY))
            if (!$decoded.StartsWith("untrusted comment: rsign encrypted secret key")) { throw "not an rsign private key" }
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY must contain the complete base64 value generated by tauri signer generate, including its comment"
          }
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Skip existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
      - name: Build Windows installer
        if: steps.existing.outputs.exists != 'true'
        run: npm --prefix apps/desktop run tauri -- build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Sign Windows installer
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "bifrost-drive-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced" }
          & signtool sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
      - name: Sign updater artifact
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "bifrost-drive-updater.key"
          [IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced" }
          $env:TAURI_SIGNING_PRIVATE_KEY_PATH = $keyPath
          npm --prefix apps/desktop run tauri -- signer sign --private-key-path $keyPath $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Tauri updater signing failed" }
      - name: Generate updater manifest
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $artifact = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $artifact) { throw "Signed updater artifact was not produced" }
          $signature = Get-Content "$($artifact.FullName).sig" -Raw
          $manifest = @{
            version = $version
            notes = "Bifrost Drive $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/Wolfskii/Bifrost-Drive/releases/download/v$version/$($artifact.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json -Encoding utf8
      - name: Generate checksum
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Bifrost-Drive-Setup-x64.exe" | Out-File "$($installer.DirectoryName)/SHA256SUMS.txt"
          Copy-Item $installer "$($installer.DirectoryName)/Bifrost-Drive-Setup-x64.exe"
      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "v$version" `
            target/x86_64-pc-windows-msvc/release/bundle/nsis/Bifrost-Drive-Setup-x64.exe `
            target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt `
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig `
            target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json `
            --title "Bifrost Drive $version" --generate-notes
