name: Development Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_BUILD_CHANNEL: release

concurrency:
  group: development-release
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux release assets
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libglib2.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install verified WinFsp SDK
        shell: pwsh
        run: |
          & apps/desktop/src-tauri/windows/fetch-winfsp.ps1
          $msi = (Resolve-Path .cache/winfsp/winfsp-2.1.25156.msi).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WinFsp installation failed with exit code $($process.ExitCode)" }
      - run: npm ci
      - name: Build Linux updater assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm --prefix apps/desktop run tauri -- build --bundles appimage --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v6
        with:
          name: bifrost-drive-linux-assets
          path: target/release/bundle/appimage/*
          if-no-files-found: error

  macos:
    name: Build macOS release assets
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Build macOS updater assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm --prefix apps/desktop run tauri -- build --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v6
        with:
          name: bifrost-drive-macos-assets
          path: |
            target/release/bundle/dmg/*
            target/release/bundle/macos/*
          if-no-files-found: error

  version:
    name: Synchronize development version
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[auto-version]')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      commit_sha: ${{ steps.bump.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install workspace check dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
      - id: bump
        shell: bash
        run: |
          echo "bumped=false" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          cargo run -p xtask -- version-bump
          if git diff --quiet; then
            exit 0
          fi
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock package.json package-lock.json apps/desktop/package.json
          git commit -m "[auto-version] bump patch version"
          git push origin HEAD:develop
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: [version, linux, macos]
    if: always() && needs.linux.result == 'success' && needs.macos.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Build frontend
        run: npm --prefix apps/desktop run build
      - name: Lint frontend
        run: npm --prefix apps/desktop run lint
      - name: Test frontend
        run: npm --prefix apps/desktop run test
      - name: Validate release metadata
        run: cargo run -p xtask -- release-check
      - name: Validate updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Development releases require TAURI_SIGNING_PRIVATE_KEY repository secret"
          }
          try {
            $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY))
            if (!$decoded.StartsWith("untrusted comment: rsign encrypted secret key")) { throw "not an rsign private key" }
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY must contain the complete value generated by tauri signer generate"
          }
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Skip existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
      - name: Build Windows installer
        if: steps.existing.outputs.exists != 'true'
        run: npm --prefix apps/desktop run tauri -- build --target x86_64-pc-windows-msvc
      - name: Create development Authenticode certificate
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Bifrost Drive Development" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: development_certificate
      - name: Sign Windows installer with development certificate
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.development_certificate.outputs.thumbprint }}
        run: |
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced" }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -File |
            Where-Object { $_.DirectoryName -like "*\x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "Windows SDK signtool.exe was not found under $sdkRoot" }
          & $signTool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $($signTool.FullName)" }
      - name: Sign updater artifact
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "bifrost-drive-updater.key"
          [IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced" }
          $env:TAURI_SIGNING_PRIVATE_KEY_PATH = $keyPath
          $env:TAURI_SIGNING_PRIVATE_KEY = $null
          npm --prefix apps/desktop run tauri -- signer sign --private-key-path $keyPath --password "" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Tauri updater signing failed" }
      - uses: actions/download-artifact@v7
        if: steps.existing.outputs.exists != 'true'
        with:
          name: bifrost-drive-linux-assets
          path: release-assets/linux
      - uses: actions/download-artifact@v7
        if: steps.existing.outputs.exists != 'true'
        with:
          name: bifrost-drive-macos-assets
          path: release-assets/macos
      - name: Generate updater manifest
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $artifact = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $artifact) { throw "Signed updater artifact was not produced" }
          $signature = Get-Content "$($artifact.FullName).sig" -Raw
          $linuxArtifact = Get-ChildItem release-assets/linux -Recurse -Filter *.AppImage | Select-Object -First 1
          if ($null -eq $linuxArtifact) { throw "Linux AppImage updater artifact was not downloaded" }
          $linuxSignature = Get-Content "$($linuxArtifact.FullName).sig" -Raw
          $macArtifact = Get-ChildItem release-assets/macos -Recurse -Filter *.app.tar.gz | Select-Object -First 1
          if ($null -eq $macArtifact) { throw "macOS .app.tar.gz updater artifact was not downloaded" }
          $macSignature = Get-Content "$($macArtifact.FullName).sig" -Raw
          $manifest = @{
            version = $version
            notes = "Bifrost Drive development build $version. The Authenticode certificate is self-signed and intended for testing only."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/Wolfskii/Bifrost-Drive/releases/download/v$version/Bifrost-Drive-Setup-x64.exe"
              }
              "linux-x86_64" = @{
                signature = $linuxSignature.Trim()
                url = "https://github.com/Wolfskii/Bifrost-Drive/releases/download/v$version/$($linuxArtifact.Name)"
              }
              "darwin-x86_64" = @{
                signature = $macSignature.Trim()
                url = "https://github.com/Wolfskii/Bifrost-Drive/releases/download/v$version/$($macArtifact.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json -Encoding utf8
      - name: Generate checksum
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Bifrost-Drive-Setup-x64.exe" | Out-File "$($installer.DirectoryName)/SHA256SUMS.txt"
          Copy-Item $installer "$($installer.DirectoryName)/Bifrost-Drive-Setup-x64.exe"
      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseArgs = @(
            "release", "create", "v$version",
            "target/x86_64-pc-windows-msvc/release/bundle/nsis/Bifrost-Drive-Setup-x64.exe",
            "target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt",
            "target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json",
            "--title", "Bifrost Drive development $version",
            "--generate-notes"
          )
          $releaseArgs += (Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig | Select-Object -First 1).FullName
          $releaseArgs += @(Get-ChildItem release-assets/linux -Recurse -File | ForEach-Object { $_.FullName })
          $releaseArgs += @(Get-ChildItem release-assets/macos -Recurse -File | ForEach-Object { $_.FullName })
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
