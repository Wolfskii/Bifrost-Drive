name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "docker-compose.yml"
      - "tests/servers/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  provider-integration:
    name: Provider integration services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev openssh-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: arduino/setup-task@v2
      - name: Test provider connections
        run: task test:connections
