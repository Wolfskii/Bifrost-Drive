name: Check, Build, and Release

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.0); defaults to at least 0.2.0, then one patch after the latest release
        required: false
        type: string

permissions:
  actions: write
  contents: read

env:
  VITE_BUILD_CHANNEL: release

concurrency:
  group: develop-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm --prefix apps/desktop run build
      - name: Lint frontend
        run: npm --prefix apps/desktop run lint
      - name: Test frontend
        run: npm --prefix apps/desktop run test

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev libfuse3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  macos-file-provider:
    name: macOS File Provider checks
    # Disabled until Apple signing and developer-account provisioning are available.
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install extension build tools
        run: brew install xcodegen
      - name: Test File Provider transport
        run: swift test --package-path platforms/macos/file-provider
      - name: Build File Provider extension
        run: bash platforms/macos/file-provider/build.sh

  version:
    name: Plan release version
    if: github.event_name != 'pull_request'
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Calculate release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${MANUAL_VERSION#v}"
          if [[ -z "$version" ]]; then
            latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')"
            if [[ -z "$latest_tag" ]]; then
              version="0.2.0"
            else
              latest="${latest_tag#v}"
              if [[ ! "$latest" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Latest release tag '$latest_tag' is not a patchable semantic version" >&2
                exit 1
              fi
              latest_major="${BASH_REMATCH[1]}"
              latest_minor="${BASH_REMATCH[2]}"
              latest_patch="${BASH_REMATCH[3]}"
              if (( 10#$latest_major == 0 && 10#$latest_minor < 2 )); then
                version="0.2.0"
              else
                version="$latest_major.$latest_minor.$((10#$latest_patch + 1))"
              fi
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version '$version' is not valid semantic versioning" >&2
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY repository secret is required" >&2
            exit 1
          fi

  linux:
    name: Build Linux package
    needs: [version, rust]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libglib2.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse3-dev rpm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      # macOS File Provider tooling is intentionally not installed on Linux.
      # - name: Install macOS extension build tools
      #   run: brew install xcodegen
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo run -p xtask -- version-set "$RELEASE_VERSION"
      - name: Build AppImage and RPM packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm --prefix apps/desktop run tauri -- build --bundles appimage,rpm --config src-tauri/tauri.release.conf.json
      - name: Verify Linux FUSE runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          rpm_package="$(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          if [[ -z "$rpm_package" ]]; then
            echo "RPM package was not produced" >&2
            exit 1
          fi
          rpm -qp --requires "$rpm_package" | grep -Fx fuse3
      - uses: actions/upload-artifact@v6
        with:
          name: bifrost-drive-linux-${{ needs.version.outputs.version }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
      - name: Cancel sibling package builds
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  macos:
    name: Build macOS package
    # Disabled until Apple signing and developer-account provisioning are available.
    if: ${{ false }}
    needs: version
    runs-on: macos-latest
    outputs:
      updater_platform: ${{ steps.platform.outputs.updater_platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo run -p xtask -- version-set "$RELEASE_VERSION"
      - name: Select updater platform
        id: platform
        shell: bash
        run: |
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            echo "updater_platform=darwin-aarch64" >> "$GITHUB_OUTPUT"
          else
            echo "updater_platform=darwin-x86_64" >> "$GITHUB_OUTPUT"
          fi
      - name: Build macOS File Provider extension
        run: platforms/macos/file-provider/build.sh
      - name: Build macOS updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm --prefix apps/desktop run tauri -- build --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Verify ad-hoc macOS signature
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "macOS application bundle was not produced" >&2
            exit 1
          fi
          test -d "$app/Contents/PlugIns/BifrostFileProvider.appex"
          test -f "$app/Contents/Frameworks/libBifrostFileProviderHostBridge.dylib"
          extension_point="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$app/Contents/PlugIns/BifrostFileProvider.appex/Contents/Info.plist")"
          if [[ "$extension_point" != "com.apple.fileprovider-nonui" ]]; then
            echo "Unexpected File Provider extension point: $extension_point" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$app/Contents/PlugIns/BifrostFileProvider.appex"
          codesign --verify --strict --verbose=2 "$app/Contents/Frameworks/libBifrostFileProviderHostBridge.dylib"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" 2>&1 | grep -q 'group.com.bifrost.drive'
          codesign -d --entitlements :- "$app/Contents/PlugIns/BifrostFileProvider.appex" 2>&1 | grep -q 'group.com.bifrost.drive'
          identity="$(codesign -dvv "$app" 2>&1 | sed -n 's/^Signature=//p')"
          if [[ "$identity" != "adhoc" ]]; then
            echo "Expected an ad-hoc macOS signature, found: ${identity:-none}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: bifrost-drive-macos-${{ needs.version.outputs.version }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
      - name: Cancel sibling package builds
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  windows:
    name: Build Windows package
    needs: [version, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install verified WinFsp SDK
        shell: pwsh
        run: |
          & apps/desktop/src-tauri/windows/fetch-winfsp.ps1
          $msi = (Resolve-Path .cache/winfsp/winfsp-2.1.25156.msi).Path
          $arguments = @('/i', $msi, '/qn', '/norestart', 'ADDLOCAL=ALL')
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "WinFsp installation failed with exit code $($process.ExitCode)"
          }
          $library = Join-Path ${env:ProgramFiles(x86)} 'WinFsp\lib\winfsp-x64.lib'
          if (!(Test-Path $library)) {
            throw "WinFsp SDK import library was not installed: $library"
          }
      - run: npm ci
      - name: Apply release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo run -p xtask -- version-set $env:RELEASE_VERSION
      - name: Build Windows updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm --prefix apps/desktop run tauri -- build --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json
      - name: Authenticode-sign Windows installer
        id: authenticode
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Bifrost Drive Development' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          } else {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'bifrost-drive-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          }
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced' }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -File |
            Where-Object { $_.DirectoryName -like '*\x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "Windows SDK signtool.exe was not found under $sdkRoot" }
          & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $($signTool.FullName)" }
      - name: Re-sign updater artifact after Authenticode
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY_PATH = $null
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced' }
          npm --prefix apps/desktop run tauri -- signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Tauri updater signing failed' }
          $normalized = Join-Path $installer.DirectoryName 'Bifrost-Drive-Setup-x64.exe'
          Move-Item $installer.FullName $normalized -Force
          Move-Item "$($installer.FullName).sig" "$normalized.sig" -Force
      - uses: actions/upload-artifact@v6
        with:
          name: bifrost-drive-windows-${{ needs.version.outputs.version }}
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/Bifrost-Drive-Setup-x64.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/Bifrost-Drive-Setup-x64.exe.sig
          if-no-files-found: error
      - name: Cancel sibling package builds
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  release:
    name: Publish GitHub release
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: bifrost-drive-linux-${{ needs.version.outputs.version }}
          path: release-assets/linux
      - uses: actions/download-artifact@v7
        with:
          name: bifrost-drive-windows-${{ needs.version.outputs.version }}
          path: release-assets/windows
      - name: Generate updater manifest and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          windows_artifact="$(find release-assets/windows -type f -name '*.exe' -print -quit)"
          linux_artifact="$(find release-assets/linux -type f -name '*.AppImage' -print -quit)"
          rpm_artifact="$(find release-assets/linux -type f -name '*.rpm' -print -quit)"
          for artifact in "$windows_artifact" "$linux_artifact"; do
            if [[ -z "$artifact" || ! -f "$artifact.sig" ]]; then
              echo "Updater artifact or signature is missing: $artifact" >&2
              exit 1
            fi
          done
          if [[ -z "$rpm_artifact" ]]; then
            echo "Linux RPM package is missing" >&2
            exit 1
          fi
          windows_name="$(basename "$windows_artifact")"
          linux_name="$(basename "$linux_artifact")"
          windows_url_name="$(jq -rn --arg value "$windows_name" '$value | @uri')"
          linux_url_name="$(jq -rn --arg value "$linux_name" '$value | @uri')"
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_signature "$(tr -d '\r\n' < "$windows_artifact.sig")" \
            --arg windows_url "$base_url/$windows_url_name" \
            --arg linux_signature "$(tr -d '\r\n' < "$linux_artifact.sig")" \
            --arg linux_url "$base_url/$linux_url_name" \
            '{
              version: $version,
              notes: ("Bifrost Drive " + $version),
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $windows_signature, url: $windows_url },
                "linux-x86_64": { signature: $linux_signature, url: $linux_url }
              }
            }' > release-assets/latest.json

          publish_directory="release-assets/publish"
          mkdir -p "$publish_directory"
          stage_asset() {
            local source="$1"
            local destination="$publish_directory/$(basename "$source")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release asset name: $(basename "$source")" >&2
              exit 1
            fi
            cp "$source" "$destination"
          }
          for artifact in \
            "$windows_artifact" "$windows_artifact.sig" \
            "$linux_artifact" "$linux_artifact.sig" \
            "$rpm_artifact"; do
            stage_asset "$artifact"
          done
          stage_asset release-assets/latest.json

          : > "$publish_directory/SHA256SUMS.txt"
          while IFS= read -r -d '' file; do
            hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> "$publish_directory/SHA256SUMS.txt"
          done < <(find "$publish_directory" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z)
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets/publish -maxdepth 1 -type f -print0 | sort -z)
          gh release create "v$RELEASE_VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bifrost Drive $RELEASE_VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
