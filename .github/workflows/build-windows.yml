name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  VITE_BUILD_CHANNEL: release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install verified WinFsp SDK
        shell: pwsh
        run: |
          & apps/desktop/src-tauri/windows/fetch-winfsp.ps1
          $msi = (Resolve-Path .cache/winfsp/winfsp-2.1.25156.msi).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WinFsp installation failed with exit code $($process.ExitCode)" }
      - run: npm ci
      - run: npm --prefix apps/desktop run tauri -- build --target x86_64-pc-windows-msvc
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Sign Windows installer
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "bifrost-drive-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced" }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -File |
            Where-Object { $_.DirectoryName -like "*\x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "Windows SDK signtool.exe was not found under $sdkRoot" }
          & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $($signTool.FullName)" }
      - uses: actions/upload-artifact@v6
        with:
          name: bifrost-drive-windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
