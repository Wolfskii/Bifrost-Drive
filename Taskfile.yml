version: "3"

vars:
  DESKTOP_DIR: apps/desktop
  RUST_TARGET: x86_64-pc-windows-msvc
  WEBDAV_COMPOSE_FILE: tests/servers/webdav/docker-compose.yml
  MINIO_TEST_PORT: '{{default "9000" .MINIO_API_PORT}}'
  S3MOCK_TEST_PORT: '{{default "9090" .S3MOCK_PORT}}'
  WEBDAV_TEST_PORT: '{{default "8080" .WEBDAV_PORT}}'
  SFTP_TEST_PORT: '{{default "2222" .SFTP_PORT}}'
  FTP_TEST_PORT: '{{default "2121" .FTP_PORT}}'
  SMB_TEST_PORT: '{{default "1445" .SMB_PORT}}'
  IMMICH_TEST_PORT: '{{default "2283" .IMMICH_PORT}}'

silent: true

tasks:
  setup:
    desc: Check prerequisites and install workspace dependencies
    cmds:
      - task: check:tools
      - npm install
      - cargo fetch

  install:
    desc: Install JavaScript dependencies
    cmds:
      - npm install

  check:tools:
    desc: Verify required developer tools are available
    cmds:
      - cargo --version
      - rustc --version
      - node --version
      - npm --version
      - task --version

  dev:
    desc: Start the Tauri desktop application
    deps: [install]
    cmds:
      - task: dev:desktop

  dev:desktop:
    desc: Start the Tauri desktop application with frontend hot reload
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - npm run tauri -- dev

  dev:rust:
    desc: Run the Rust workspace checks in watch mode when cargo-watch is installed
    cmds:
      - cargo watch -x check

  dev:windows:
    desc: Start the Windows development build
    cmds:
      - task: dev:desktop

  build:
    desc: Build Rust workspace and frontend
    cmds:
      - cargo build --workspace
      - npm --prefix '{{.DESKTOP_DIR}}' run build

  build:windows:
    desc: Build the Windows x64 Tauri bundle
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - npm run tauri -- build --target '{{.RUST_TARGET}}'

  build:macos:
    desc: Build the macOS Tauri bundle on macOS
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - npm run tauri -- build

  build:linux:
    desc: Build the Linux Tauri bundle on Linux
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - npm run tauri -- build

  test:
    desc: Run Rust and frontend tests
    cmds:
      - task: test:unit
      - task: test:connections

  test:unit:
    desc: Run all unit tests
    cmds:
      - cargo test --workspace
      - npm --prefix '{{.DESKTOP_DIR}}' run test

  test:integration:
    desc: Compatibility alias for test:connections
    cmds:
      - task: test:connections

  test:connections:
    desc: Start every provider service, run connection contracts, and tear them down
    env:
      BIFROST_S3_INTEGRATION: "1"
      BIFROST_WEBDAV_INTEGRATION: "1"
      BIFROST_SFTP_INTEGRATION: "1"
      BIFROST_SFTP_KEY_INTEGRATION: "1"
      BIFROST_FTP_INTEGRATION: "1"
      BIFROST_SMB_INTEGRATION: "1"
      MINIO_API_PORT: "{{.MINIO_TEST_PORT}}"
      BIFROST_S3_ENDPOINT: http://127.0.0.1:{{.MINIO_TEST_PORT}}
      S3MOCK_PORT: "{{.S3MOCK_TEST_PORT}}"
      WEBDAV_PORT: "{{.WEBDAV_TEST_PORT}}"
      BIFROST_WEBDAV_ENDPOINT: http://127.0.0.1:{{.WEBDAV_TEST_PORT}}/webdav
      WEBDAV_USERNAME: test
      WEBDAV_PASSWORD: test
      SFTP_PORT: "{{.SFTP_TEST_PORT}}"
      FTP_PORT: "{{.FTP_TEST_PORT}}"
      BIFROST_FTP_ENDPOINT: ftp://127.0.0.1:{{.FTP_TEST_PORT}}
      SMB_PORT: "{{.SMB_TEST_PORT}}"
      BIFROST_SMB_ENDPOINT: smb://127.0.0.1:{{.SMB_TEST_PORT}}/share
    cmds:
      - defer: docker compose down -v --remove-orphans
      - mkdir -p .cache
      - mkdir -p .cache/sftp_keys
      - rm -f .cache/sftp_keys/id_ed25519 .cache/sftp_keys/id_ed25519.pub
      - ssh-keygen -q -t ed25519 -N "" -f .cache/sftp_keys/id_ed25519
      - task: docker:up
      - ssh-keyscan -p "${SFTP_PORT:-2222}" 127.0.0.1 > .cache/sftp_known_hosts
      - cargo test -p bifrost-s3 --test minio -- --ignored --nocapture
      - BIFROST_S3_ENDPOINT=http://127.0.0.1:${S3MOCK_PORT:-9090} cargo test -p bifrost-s3 --test minio -- --ignored --nocapture
      - cargo test -p bifrost-webdav --test apache -- --ignored --nocapture
      - cargo test -p bifrost-sftp --test atmoz -- --ignored --nocapture
      - cargo test -p bifrost-ftp --test fixture -- --ignored --nocapture
      - cargo test -p bifrost-smb --test fixture -- --ignored --nocapture

  test:webdav:
    desc: Run the WebDAV verb contract against a local Apache server
    env:
      BIFROST_WEBDAV_INTEGRATION: "1"
      BIFROST_WEBDAV_ENDPOINT: http://127.0.0.1:{{.WEBDAV_TEST_PORT}}/webdav
      WEBDAV_USERNAME: test
      WEBDAV_PASSWORD: test
    cmds:
      - task: docker:webdav:up
      - defer: docker compose -f '{{.WEBDAV_COMPOSE_FILE}}' down -v
      - cargo test -p bifrost-webdav --test apache -- --ignored --nocapture

  test:immich:
    desc: Start a fresh Immich Docker stack and run the provider contract
    deps: [docker:start]
    env:
      BIFROST_IMMICH_INTEGRATION: "1"
      BIFROST_IMMICH_ENDPOINT: http://127.0.0.1:{{.IMMICH_TEST_PORT}}
      IMMICH_PORT: "{{.IMMICH_TEST_PORT}}"
    cmds:
      - defer: docker compose -f tests/servers/immich/docker-compose.yml down -v --remove-orphans
      - docker compose -f tests/servers/immich/docker-compose.yml up -d --wait
      - cargo test -p bifrost-immich --test immich -- --ignored --nocapture

  lint:
    desc: Run Rust and frontend linters
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - npm --prefix '{{.DESKTOP_DIR}}' run lint

  format:
    desc: Format Rust and frontend sources
    cmds:
      - cargo fmt --all
      - npm exec prettier -- --write .

  format:check:
    desc: Check formatting without modifying files
    cmds:
      - cargo fmt --all -- --check
      - npm exec prettier -- --check .

  check:
    desc: Run compiler and frontend production checks
    cmds:
      - cargo check --workspace --all-targets
      - npm --prefix '{{.DESKTOP_DIR}}' run build

  clean:
    desc: Remove generated build output
    cmds:
      - cargo clean
      - npm exec -- rimraf apps/desktop/dist

  docker:up:
    desc: Start local integration services
    deps: [docker:start]
    cmds:
      - docker compose up -d --build --wait

  docker:start:
    desc: Start Docker Desktop when the Docker daemon is not ready
    cmds:
      - cmd: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/ensure-docker.ps1
        platforms: [windows]
      - cmd: sh ./scripts/ensure-docker.sh
        platforms: [linux, darwin]

  docker:webdav:up:
    desc: Start the standalone Apache WebDAV test server
    deps: [docker:start]
    cmds:
      - docker compose -f '{{.WEBDAV_COMPOSE_FILE}}' up -d --build --wait

  docker:webdav:down:
    desc: Stop the standalone Apache WebDAV test server
    cmds:
      - docker compose -f '{{.WEBDAV_COMPOSE_FILE}}' down -v

  docker:webdav:logs:
    desc: Follow standalone Apache WebDAV test server logs
    cmds:
      - docker compose -f '{{.WEBDAV_COMPOSE_FILE}}' logs -f

  docker:down:
    desc: Stop local integration services
    cmds:
      - docker compose down

  docker:logs:
    desc: Follow local integration service logs
    cmds:
      - docker compose logs -f

  db:migrate:
    desc: Apply SQLite migrations through the application migration runner
    cmds:
      - cargo run -p bifrost-db --bin bifrost-db-migrate

  db:reset:
    desc: Delete the local development database and apply migrations
    cmds:
      - cargo run -p xtask -- db-reset

  package:
    desc: Build the native Tauri bundle for the current host
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - npm run tauri -- build

  package:windows:
    desc: Produce the Windows x64 setup executable
    cmds:
      - task: build:windows

  cleanup:windows-drives:
    desc: Safely remove lingering Bifrost drives and Explorer entries on Windows
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/cleanup-windows-drives.ps1

  version:
    desc: Check synchronized workspace versions
    cmds:
      - cargo run -p xtask -- version-check

  release:
    desc: Validate release metadata; publishing is performed by protected CI
    cmds:
      - cargo run -p xtask -- release-check

  release:dry-run:
    desc: Show the release decision without changing files or tags
    cmds:
      - cargo run -p xtask -- release-dry-run
