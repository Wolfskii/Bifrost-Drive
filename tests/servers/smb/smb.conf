[global]
server role = standalone server
server min protocol = SMB2
server max protocol = SMB3
disable netbios = yes
smb ports = 445
map to guest = never
load printers = no
printing = bsd
printcap name = /dev/null

[share]
path = /srv/samba/share
browseable = yes
read only = no
guest ok = no
valid users = bifrost-dev
force user = bifrost-dev
create mask = 0644
directory mask = 0755