name: bifrost-immich-test

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: immich-test
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:${IMMICH_PORT:-2283}:2283"
    volumes:
      - immich-upload:/data
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:2283/api/server/config"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: immich-test
      POSTGRES_USER: immich
      POSTGRES_DB: immich
    volumes:
      - immich-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  immich-upload:
  immich-database:
