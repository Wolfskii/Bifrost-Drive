[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/bifrost-api",
    "crates/bifrost-common",
    "crates/bifrost-core",
    "crates/bifrost-cache",
    "crates/bifrost-crypto",
    "crates/bifrost-db",
    "crates/bifrost-s3",
    "crates/bifrost-ftp",
    "crates/bifrost-google-drive",
    "crates/bifrost-google-photos",
    "crates/bifrost-immich",
    "crates/bifrost-smb",
    "crates/bifrost-storage",
    "crates/bifrost-transfer",
    "crates/bifrost-sftp",
    "crates/bifrost-sync",
    "crates/bifrost-webdav",
    "platforms/windows/credentials",
    "platforms/windows/cfapi",
    "platforms/windows/winfsp",
    "platforms/macos/credentials",
    "platforms/linux/credentials",
    "platforms/linux/fuse",
    "xtask",
]
default-members = [
    "apps/desktop/src-tauri",
    "crates/bifrost-api",
    "crates/bifrost-common",
    "crates/bifrost-core",
    "crates/bifrost-cache",
    "crates/bifrost-crypto",
    "crates/bifrost-db",
    "crates/bifrost-s3",
    "crates/bifrost-ftp",
    "crates/bifrost-google-drive",
    "crates/bifrost-google-photos",
    "crates/bifrost-immich",
    "crates/bifrost-smb",
    "crates/bifrost-storage",
    "crates/bifrost-transfer",
    "crates/bifrost-sftp",
    "crates/bifrost-sync",
    "crates/bifrost-webdav",
    "platforms/windows/credentials",
    "platforms/windows/cfapi",
    "platforms/windows/winfsp",
    "platforms/macos/credentials",
    "platforms/linux/credentials",
    "platforms/linux/fuse",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Wolfskii/Bifrost-Drive"
authors = ["Bifrost Drive contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-config = { version = "=1.8.8", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "=1.2.14"
aws-sdk-s3 = { version = "=1.130.0", default-features = false, features = ["behavior-version-latest", "http-1x", "rt-tokio", "rustls"] }
aws-smithy-async = "=1.2.14"
aws-smithy-runtime-api-macros = "=1.0.0"
aws-smithy-types = "=1.4.7"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
russh = { version = "=0.63.1", default-features = false, features = ["ring"] }
russh-sftp = "=2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uuid = { version = "1.16", features = ["serde", "v4"] }
url = { version = "2.5", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
windows = "0.62"
