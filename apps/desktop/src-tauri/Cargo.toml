[package]
name = "bifrost-drive"
version.workspace = true
description = "One gateway. Every storage."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "bifrost_drive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
async-trait.workspace = true
bifrost-api = { path = "../../../crates/bifrost-api" }
bifrost-cache = { path = "../../../crates/bifrost-cache" }
bifrost-common = { path = "../../../crates/bifrost-common" }
bifrost-core = { path = "../../../crates/bifrost-core" }
bifrost-db = { path = "../../../crates/bifrost-db" }
bifrost-crypto = { path = "../../../crates/bifrost-crypto" }
bifrost-windows-credentials = { path = "../../../platforms/windows/credentials" }
bifrost-s3 = { path = "../../../crates/bifrost-s3" }
bifrost-sftp = { path = "../../../crates/bifrost-sftp" }
bifrost-sync = { path = "../../../crates/bifrost-sync" }
bifrost-storage = { path = "../../../crates/bifrost-storage" }
bifrost-webdav = { path = "../../../crates/bifrost-webdav" }
bifrost-transfer = { path = "../../../crates/bifrost-transfer" }
bifrost-windows-cfapi = { path = "../../../platforms/windows/cfapi" }
chrono.workspace = true
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-updater = "2.0"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url.workspace = true
uuid.workspace = true
